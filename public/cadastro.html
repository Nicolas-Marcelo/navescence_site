<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Criar conta - NAVESCENCE</title>

  <link
    rel="stylesheet"
    href="/auth.css"
  >
</head>

<body>
  <main class="page">
    <section
      class="auth-card"
      aria-labelledby="titulo"
    >
      <a
        class="brand"
        href="/"
      >
        <span
          class="logo small"
          aria-hidden="true"
        >
          N
        </span>

        <span>NAVESCENCE</span>
      </a>

      <div class="auth-header">
        <p class="eyebrow">
          Cadastro
        </p>

        <h1 id="titulo">
          Crie sua conta
        </h1>

        <p>
          Informe seus dados para utilizar o NAVESCENCE.
        </p>
      </div>

      <div
        id="message"
        class="message hidden"
        role="status"
        aria-live="polite"
      ></div>

      <form
        id="register-form"
        novalidate
      >
        <div class="field">
          <label for="name">
            Nome
          </label>

          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            maxlength="120"
            placeholder="Seu nome"
            aria-describedby="name-error"
          >

          <p
            id="name-error"
            class="field-error"
            aria-live="polite"
          ></p>
        </div>

        <div class="field">
          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            maxlength="180"
            placeholder="nome@exemplo.com"
            aria-describedby="email-error"
          >

          <p
            id="email-error"
            class="field-error"
            aria-live="polite"
          ></p>
        </div>

        <div class="field">
          <label for="password">
            Senha
          </label>

          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              maxlength="100"
              aria-describedby="password-help password-error"
            >

            <button
              class="password-toggle"
              type="button"
              data-toggle-password="password"
              aria-label="Mostrar senha"
            >
              Mostrar
            </button>
          </div>

          <p
            id="password-help"
            class="field-help"
          >
            Mínimo de 8 caracteres, com letra maiúscula,
            minúscula e número.
          </p>

          <p
            id="password-error"
            class="field-error"
            aria-live="polite"
          ></p>
        </div>

        <div class="field">
          <label for="confirm-password">
            Confirmar senha
          </label>

          <div class="password-wrapper">
            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              maxlength="100"
              aria-describedby="confirm-password-error"
            >

            <button
              class="password-toggle"
              type="button"
              data-toggle-password="confirm-password"
              aria-label="Mostrar confirmação de senha"
            >
              Mostrar
            </button>
          </div>

          <p
            id="confirm-password-error"
            class="field-error"
            aria-live="polite"
          ></p>
        </div>

        <button
          id="submit-button"
          class="button primary full"
          type="submit"
        >
          Criar conta
        </button>
      </form>

      <div class="auth-footer">
        <p>
          Já possui uma conta?
        </p>

        <a href="/login.html">
          Entrar
        </a>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="/js/auth.js"
  ></script>
</body>
</html>
