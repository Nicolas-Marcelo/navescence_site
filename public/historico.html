<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Histórico - NAVESCENCE</title>

  <link
    rel="stylesheet"
    href="/auth.css"
  >
</head>

<body>
  <header class="topbar">
    <a
      class="brand"
      href="/"
    >
      <span
        class="logo small"
        aria-hidden="true"
      >
        N
      </span>

      <span>NAVESCENCE</span>
    </a>

    <nav class="topnav">
      <a href="/conta.html">
        Minha conta
      </a>

      <button
        id="logout-button"
        class="link-button"
        type="button"
      >
        Sair
      </button>
    </nav>
  </header>

  <main class="dashboard">
    <section>
      <p class="eyebrow">
        Navegação
      </p>

      <h1>
        Histórico de hoje
      </h1>

      <p>
        Navegações realizadas com sua conta durante o dia.
      </p>
    </section>

    <div
      id="history-status"
      class="message"
      role="status"
      aria-live="polite"
    >
      Carregando histórico...
    </div>

    <section
      id="history-list"
      class="history-list"
    ></section>
  </main>

  <script type="module">
    import {
      apiRequest,
      encerrarSessao,
      exigirSessao
    } from "/js/session.js";

    exigirSessao();

    const status =
      document.getElementById(
        "history-status"
      );

    const list =
      document.getElementById(
        "history-list"
      );

    const logoutButton =
      document.getElementById(
        "logout-button"
      );

    logoutButton.addEventListener(
      "click",
      () => {
        encerrarSessao();

        window.location.href =
          "/login.html";
      }
    );

    try {
      const history =
        await apiRequest(
          "/api/navigation-history/today"
        );

      if (!history.length) {
        status.textContent =
          "Nenhuma navegação registrada hoje.";
      } else {
        status.classList.add(
          "hidden"
        );

        for (
          const item of history
        ) {
          list.appendChild(
            criarCard(item)
          );
        }
      }
    } catch {
      status.textContent =
        "Não foi possível carregar o histórico.";
    }

    function criarCard(item) {
      const article =
        document.createElement(
          "article"
        );

      article.className =
        "history-card";

      const statusText =
        traduzirStatus(
          item.status
        );

      article.innerHTML = `
        <div class="history-header">
          <div>
            <p class="eyebrow">
              ${escapeHtml(statusText)}
            </p>

            <h2>
              ${escapeHtml(
                item.destinationName ||
                item.destinationNodeCode
              )}
            </h2>
          </div>

          <time>
            ${formatarHorario(
              item.startedAt
            )}
          </time>
        </div>

        <div class="history-route">
          <span>
            ${escapeHtml(
              item.originNodeCode
            )}
          </span>

          <span aria-hidden="true">
            →
          </span>

          <span>
            ${escapeHtml(
              item.destinationNodeCode
            )}
          </span>
        </div>

        ${
          Array.isArray(item.events) &&
          item.events.length
            ? criarEventos(
                item.events
              )
            : ""
        }
      `;

      return article;
    }

    function criarEventos(events) {
      return `
        <div class="events">
          <h3>Trajeto registrado</h3>

          <ol>
            ${events
              .map(
                event => `
                  <li>
                    <strong>
                      ${escapeHtml(
                        event.label ||
                        event.nodeCode
                      )}
                    </strong>

                    <span>
                      ${escapeHtml(
                        event.nodeCode
                      )}
                    </span>

                    <time>
                      ${formatarHorario(
                        event.occurredAt
                      )}
                    </time>
                  </li>
                `
              )
              .join("")}
          </ol>
        </div>
      `;
    }

    function traduzirStatus(value) {
      if (value === "ACTIVE") {
        return "Em andamento";
      }

      if (value === "COMPLETED") {
        return "Concluída";
      }

      if (value === "CANCELLED") {
        return "Cancelada";
      }

      return value ?? "";
    }

    function formatarHorario(value) {
      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      return date.toLocaleTimeString(
        "pt-BR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    function escapeHtml(value) {
      const div =
        document.createElement("div");

      div.textContent =
        String(value ?? "");

      return div.innerHTML;
    }
  </script>
</body>
</html>
