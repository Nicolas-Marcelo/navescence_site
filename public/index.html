<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>NAVESCENCE</title>

  <link
    rel="stylesheet"
    href="/auth.css"
  >
</head>

<body>
  <main class="page">
    <section class="hero">
      <div
        class="logo"
        aria-hidden="true"
      >
        N
      </div>

      <p class="eyebrow">
        Navegação assistiva indoor
      </p>

      <h1>NAVESCENCE</h1>

      <p class="hero-text">
        Sistema de apoio à navegação em ambientes internos,
        desenvolvido para ampliar a autonomia de pessoas
        com deficiência visual.
      </p>

      <div
        id="guest-actions"
        class="actions"
      >
        <a
          class="button primary"
          href="/login.html"
        >
          Entrar
        </a>

        <a
          class="button secondary"
          href="/cadastro.html"
        >
          Criar conta
        </a>
      </div>

      <div
        id="user-actions"
        class="actions hidden"
      >
        <a
          class="button primary"
          href="/conta.html"
        >
          Minha conta
        </a>

        <a
          class="button secondary"
          href="/historico.html"
        >
          Histórico
        </a>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      possuiSessao
    } from "/js/session.js";

    const guest =
      document.getElementById(
        "guest-actions"
      );

    const user =
      document.getElementById(
        "user-actions"
      );

    if (possuiSessao()) {
      guest.classList.add("hidden");
      user.classList.remove("hidden");
    }
  </script>
</body>
</html>
